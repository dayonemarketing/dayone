name: Fetch asset
on:
  workflow_dispatch:
    inputs:
      url: {required: true}
      out: {required: true}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p "$(dirname "${{ inputs.out }}")"
          curl -sSfL -A "Mozilla/5.0" -o "${{ inputs.out }}" "${{ inputs.url }}"
          ls -l "${{ inputs.out }}"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add "${{ inputs.out }}"
          git commit -m "Fetch ${{ inputs.out }}" || echo "no changes"
          git push
